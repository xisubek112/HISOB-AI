name: PR Quality Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Tests, and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Automated unit, repository, migration & API regression tests
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm test

      - name: Verify JSON importer dry-run safety
        run: npm run import:supabase -- --file data/database.json --dry-run

      - name: Verify fail-closed startup when DB_BACKEND=supabase lacks DATABASE_URL
        run: |
          if env -u DATABASE_URL -u SUPABASE_DB_URL DB_BACKEND=supabase npx tsx server.ts; then
            echo "ERROR: Server silently fell back instead of failing closed!"
            exit 1
          fi

      - name: Production build
        run: npm run build
